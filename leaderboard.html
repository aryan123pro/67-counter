<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hall of 67 · Taqneeq 19.0</title>
<link rel="icon" type="image/png" href="tq-icon-64.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="description" content="Leaderboard and player profiles for the 67 Counter." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Josefin+Sans:wght@300;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Taqneeq 19.0 branding: the organisation's gold-on-purple TQ logo + a gold wordmark */
  .tq-brand {
    display: inline-flex; align-items: center; gap: clamp(8px, 1.4vh, 14px); align-self: center;
    background: rgba(18, 2, 31, .72); border: 3px solid #ffc21a; border-radius: 20px;
    padding: 6px 18px 6px 6px; box-shadow: 0 0 26px rgba(255, 194, 26, .35), 5px 5px 0 #0b0614; text-align: left;
  }
  .tq-logo { width: clamp(44px, 8vh, 88px); aspect-ratio: 1; border-radius: 14px; object-fit: cover; display: block; border: 2px solid #ffc21a; }
  .tq-text b { display: block; font-family: Bungee, sans-serif; font-weight: 400; font-size: clamp(18px, 3.4vh, 34px); line-height: 1; color: #ffc21a; text-shadow: 3px 3px 0 #0b0614; white-space: nowrap; }
  .tq-text span { display: block; margin-top: 5px; font-family: "Josefin Sans", sans-serif; font-weight: 600; font-size: clamp(9px, 1.45vh, 14px); letter-spacing: .28em; color: #faebd7; white-space: nowrap; }
  /* the big version (intro screen) */
  .tq-brand.big { flex-direction: column; gap: 10px; padding: 14px 26px 12px; text-align: center; }
  .tq-brand.big .tq-logo { width: clamp(80px, 15vh, 160px); border-radius: 24px; }
  .tq-brand.big .tq-text b { font-size: clamp(24px, 5vh, 52px); }
  :root {
    --pink: #ff2bd6; --lime: #b6ff00; --cyan: #00e5ff; --yellow: #ffe600; --orange: #ff7a00; --red: #ff1f3d;
    --ink: #0b0614; --paper: #fff8e7; --bg: #12021f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--paper); font-family: "Space Mono", ui-monospace, monospace;
    min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -50%; z-index: -1;
    background: repeating-conic-gradient(from 0deg, #2a0640 0deg 10deg, #170228 10deg 20deg);
    animation: spin 60s linear infinite;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(circle at 50% 30%, transparent 0 10%, rgba(18,2,31,.88) 60%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  button { font: inherit; cursor: pointer; }

  .marquee {
    position: sticky; top: 0; z-index: 20; background: var(--yellow); color: var(--ink);
    border-bottom: 4px solid var(--ink); font-family: Bungee, sans-serif; font-size: 14px;
    white-space: nowrap; overflow: hidden; padding: 6px 0;
  }
  .marquee span { display: inline-block; animation: marquee 22s linear infinite; }
  @keyframes marquee { to { transform: translateX(-50%); } }

  main { width: min(1200px, 100%); margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 30px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand-head { display: grid; gap: 22px; justify-items: start; }
  .brand-head h1 { margin-bottom: 6px; }
  h1 {
    font-family: "Bungee Shade", Bungee, sans-serif; font-size: clamp(38px, min(6vw, 10vh), 84px); line-height: .9;
    color: var(--yellow); text-shadow: 5px 5px 0 var(--pink), 10px 10px 0 var(--cyan); transform: rotate(-2deg);
  }
  .btn {
    font-family: Bungee, sans-serif; font-size: clamp(16px, 2vw, 22px); text-decoration: none; display: inline-block;
    background: var(--lime); color: var(--ink); border: 4px solid var(--ink); border-radius: 14px;
    padding: 10px 20px; box-shadow: 5px 5px 0 var(--ink), 5px 5px 0 4px var(--pink);
  }
  .btn:hover { transform: translate(-2px,-2px) rotate(-1deg); }
  .btn.alt { background: var(--cyan); font-size: clamp(13px, 1.5vw, 16px); }
  label.btn { cursor: pointer; }
  .btn.danger { background: var(--red); color: #fff; font-size: clamp(13px, 1.5vw, 16px); }
  .prof-actions { margin-top: 14px; }
  /* confirm pop-up */
  dialog.confirm { width: min(460px, calc(100vw - 32px)); padding: 24px; text-align: center; overflow: visible; }
  .confirm h3 { font-family: Bungee, sans-serif; font-size: clamp(22px, 4vw, 30px); line-height: 1.1; overflow-wrap: anywhere; }
  .confirm p { font-weight: 700; margin: 12px 0 20px; }
  .confirm .cbtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .confirm .backup-hint[hidden] { display: none; }
  [hidden] { display: none !important; }
  .confirm input { display: block; width: 100%; font: 700 18px "Space Mono", monospace; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 10px; margin: 0 0 12px; }
  .confirm .err { color: var(--red); margin: 0 0 12px; }
  .note.live { color: var(--lime); }
  .note.live::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--lime); margin-right: 8px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .confirm .backup-hint { display: block; margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--ink); text-decoration: underline; background: none; border: 0; cursor: pointer; width: 100%; }
  .head-btns { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .note {
    font-weight: 700; opacity: .9; justify-self: start; margin-top: -8px;
    background: rgba(11, 6, 20, .55); border: 2px solid rgba(255, 248, 231, .12); border-radius: 999px; padding: 6px 14px;
  }
  .note.live { border-color: rgba(182, 255, 0, .35); }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(140px); z-index: 30;
    background: var(--lime); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px;
    font-family: Bungee, sans-serif; padding: 10px 16px; transition: transform .25s;
  }
  .toast.on { transform: translateX(-50%) translateY(0); }
  .toast:not(.on) { visibility: hidden; }
  .btn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--ink); }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .filters .lbl { font-family: Bungee, sans-serif; color: var(--yellow); font-size: 18px; margin-right: 4px; }
  .chip {
    font-family: Bungee, sans-serif; font-size: clamp(14px, 1.6vw, 18px);
    background: var(--paper); color: var(--ink); border: 3px solid var(--ink);
    border-radius: 999px; padding: 8px 18px; box-shadow: 3px 3px 0 var(--ink);
  }
  .chip[aria-pressed="true"] { background: var(--yellow); transform: rotate(-3deg) scale(1.06); box-shadow: 3px 3px 0 var(--pink); }
  .sep { width: 16px; }

  h2 {
    font-family: Bungee, sans-serif; font-size: clamp(24px, 3.5vw, 38px); color: var(--paper);
    text-shadow: 3px 3px 0 var(--pink); margin-bottom: 16px;
  }
  h2 small { font-size: .5em; color: var(--cyan); text-shadow: none; margin-left: 8px; }

  /* podium: compact, centred */
  .board-wrap { width: min(780px, 100%); margin: 14px auto 0; display: grid; gap: 22px; }
  .board-wrap h2 { margin-bottom: 18px; }
  .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 2.5vw, 22px); align-items: end; }
  .spot { text-align: center; cursor: pointer; background: none; border: 0; color: inherit; display: grid; justify-items: center; }
  .spot .medal { font-size: clamp(24px, 3.4vw, 36px); line-height: 1; margin-bottom: 6px; }
  .spot .face {
    width: min(100%, 150px); aspect-ratio: 1; border-radius: 22px; border: 4px solid var(--ink); overflow: hidden;
    box-shadow: 6px 6px 0 var(--cyan); transition: transform .15s; display: block;
  }
  .spot:nth-child(2) .face { width: min(100%, 176px); box-shadow: 7px 7px 0 var(--yellow); }
  .spot:nth-child(3) .face { box-shadow: 6px 6px 0 var(--pink); }
  .spot:hover .face { transform: translateY(-4px) rotate(-2deg); }
  .spot .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .spot .nm { font-family: Bungee, sans-serif; font-size: clamp(13px, 1.8vw, 18px); margin-top: 10px; overflow-wrap: anywhere; line-height: 1.1; }
  .spot .sc {
    font-family: Bungee, sans-serif; font-size: clamp(28px, 4.4vw, 50px); line-height: 1; margin-top: 2px;
    color: var(--yellow); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--pink);
  }
  .spot .block {
    width: 100%; margin-top: 8px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px 10px 0 0;
    font-family: Bungee, sans-serif; font-size: 20px; display: grid; place-content: center;
  }
  .spot:nth-child(2) .block { height: 64px; background: var(--yellow); }
  .spot:nth-child(1) .block { height: 44px; }
  .spot:nth-child(3) .block { height: 30px; }

  /* rankings list: one slim line per player */
  .rankings { list-style: none; display: grid; gap: 8px; }
  .row {
    display: grid; grid-template-columns: 44px 40px minmax(0, 1fr) auto; gap: 12px; align-items: center;
    background: rgba(255, 248, 231, .06); color: var(--paper); border: 2px solid rgba(255, 248, 231, .14); border-radius: 14px; padding: 6px 14px 6px 10px;
    cursor: pointer; width: 100%; text-align: left; transition: background .15s, transform .15s;
  }
  .row:hover { background: rgba(255, 248, 231, .12); transform: translateX(3px); }
  .row .pos { font-family: Bungee, sans-serif; font-size: 16px; color: var(--muted, #b9adc9); text-align: center; }
  .row .ava, .ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block; overflow: hidden; }
  .row .nm { font-family: Bungee, sans-serif; font-size: 17px; overflow-wrap: anywhere; }
  .row .nm .gif { font-size: 12px; margin-left: 6px; opacity: .8; }
  .row .sc { font-family: Bungee, sans-serif; font-size: 24px; color: var(--yellow); }
  .tap-hint { text-align: center; font-size: 13px; font-weight: 700; opacity: .65; }

  /* initials tile for players without a GIF */
  .initials { display: grid !important; place-items: center; font-family: Bungee, sans-serif; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
  .face .initials { width: 100%; height: 100%; font-size: clamp(30px, 5vw, 54px); }
  .ava.initials { font-size: 15px; }
  .prof-head .big.initials { font-size: 64px; }

  .badge {
    display: inline-block; font-family: Bungee, sans-serif; font-size: 13px; background: var(--yellow);
    border: 3px solid var(--ink); border-radius: 10px; padding: 3px 8px; transform: rotate(-2deg); justify-self: start;
  }
  .meta { font-size: 12px; font-weight: 700; opacity: .8; }

  .noimg { display: grid !important; place-items: center; font-family: Bungee, sans-serif; color: var(--yellow); font-size: 48px; }

  .empty {
    text-align: center; padding: 40px 16px; font-family: Bungee, sans-serif; font-size: clamp(20px, 3vw, 30px);
    background: rgba(11,6,20,.7); border: 4px dashed var(--yellow); border-radius: 22px;
  }
  .empty .btn { margin-top: 18px; }

  /* profile dialog */
  dialog {
    width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 32px); margin: auto;
    background: var(--paper); color: var(--ink); border: 5px solid var(--ink); border-radius: 26px;
    box-shadow: 12px 12px 0 var(--pink), 12px 12px 0 5px var(--ink); padding: 0; overflow: auto;
  }
  dialog::backdrop { background: rgba(11,6,20,.75); backdrop-filter: blur(3px); }
  .prof-head { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; padding: 22px; align-items: center; }
  .prof-head .big { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 5px solid var(--ink); box-shadow: 6px 6px 0 var(--cyan); background: #2a1b40; }
  .prof-head h3 { font-family: Bungee, sans-serif; font-size: clamp(30px, 5vw, 54px); line-height: 1; overflow-wrap: anywhere; }
  .prof-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .prof-stats div { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 8px 6px; text-align: center; }
  .prof-stats b { display: block; font-family: Bungee, sans-serif; font-size: 24px; color: var(--yellow); }
  .prof-stats small { font-size: 11px; }
  .close { position: sticky; top: 10px; float: right; margin: 10px 10px 0 0; z-index: 2; }
  .prof-sec { padding: 0 22px 22px; }
  .prof-sec h4 { font-family: Bungee, sans-serif; font-size: 20px; margin: 6px 0 12px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
  .shot { background: #fff; padding: 8px 8px 10px; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--cyan); position: relative; }
  .shot:nth-child(even) { transform: rotate(2deg); box-shadow: 5px 5px 0 var(--pink); }
  .shot:nth-child(odd) { transform: rotate(-1.5deg); }
  .shot img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #2a1b40; }
  .shot .cap { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; font-family: Bungee, sans-serif; font-size: 13px; }
  .shot .cap b { color: var(--pink); font-size: 22px; }
  .shot .dl { position: absolute; top: -12px; right: -10px; font-size: 12px; padding: 4px 9px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(6deg); }
  .shot .dl:disabled, .shot .sh:disabled { opacity: .6; cursor: wait; }
  .shot .sh { position: absolute; top: -12px; left: -10px; font-size: 12px; padding: 4px 9px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-6deg); background: var(--pink); color: #fff; }
  .history { width: 100%; border-collapse: collapse; font-weight: 700; font-size: 14px; }
  .history th { font-family: Bungee, sans-serif; font-size: 13px; text-align: left; border-bottom: 3px solid var(--ink); padding: 6px; }
  .history td { padding: 6px; border-bottom: 2px dashed rgba(11,6,20,.25); }
  .history td.n { font-family: Bungee, sans-serif; color: var(--pink); }

  @media (max-width: 720px) {
    .row { grid-template-columns: 30px 36px minmax(0, 1fr) auto; gap: 10px; padding: 6px 12px 6px 8px; }
    .row .ava { width: 36px; height: 36px; }
    .row .nm { font-size: 15px; }
    .row .sc { font-size: 20px; }
    .spot .block { font-size: 16px; }
    .prof-head { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .prof-head .big { width: 160px; height: 160px; }
    .prof-stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { body::before, .marquee span { animation: none; } }
</style>
</head>
<body>
<div class="marquee" aria-hidden="true"><span id="marquee"></span></div>
<main>
  <header>
    <div class="brand-head"><div class="tq-brand"><img class="tq-logo" src="taqneeq-logo.jpg" alt="Taqneeq 19.0 logo" /><div class="tq-text"><b>TAQNEEQ 19.0</b><span>NMIMS MPSTME PRESENTS</span></div></div><h1>HALL OF 67</h1></div>
    <div class="head-btns">
      <a class="btn" href="./">▶ PLAY</a>
    </div>
  </header>
  <p class="note" id="note">Scores and GIFs are saved on this device only, and stay after you reload.</p>

  <section class="board-wrap">
    <h2 id="topTitle">TOP 67ERS <small>30 SECONDS</small></h2>
    <div id="podium"></div>
    <ol class="rankings" id="rankings"></ol>
    <p class="tap-hint" id="tapHint" hidden>tap anyone to see their GIFs 🎞️</p>
  </section>
</main>

<dialog id="profile"></dialog>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { allRuns, isShared } from "./leaderboard-store.js";
import { shareGif } from "./share.js";
// Inside the game (embedded layer): PLAY / GO 67 just close the layer, keeping fullscreen.
// Opened directly: go fullscreen on the first tap (browsers need a tap before allowing it).
const embedded = new URLSearchParams(location.search).has("embed") && window.parent !== window;
document.addEventListener("click", (e) => {
  const play = e.target.closest('a[href="./"]');
  if (play && embedded) { e.preventDefault(); window.parent.postMessage("67-lb-close", location.origin); }
});
if (embedded) {
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !document.querySelector("dialog[open]")) window.parent.postMessage("67-lb-close", location.origin);
  });
} else {
  const goFull = () => {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    try { const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) : el.webkitRequestFullscreen?.(); p?.catch?.(() => {}); } catch {}
  };
  addEventListener("pointerdown", goFull, { once: true });
  addEventListener("keydown", goFull, { once: true });
}
const $ = (s, el = document) => el.querySelector(s);
$("#marquee").textContent = "TAQNEEQ 19.0 ✦ HALL OF 67 ✦ SIX SEVEN ✦ 👑 ✦ WHO HAS THE FASTEST HANDS ✦ 🫴🫴 ✦ ".repeat(8);

// the event runs one mode: 30-second camera rounds (older 15s/60s/keyboard rounds are hidden)
const eventRounds = (list) => list.filter((r) => +r.secs === 30 && r.input === "cam");
let runs = eventRounds(await allRuns());
const sharedMode = isShared();
if (sharedMode) { $("#note").textContent = "LIVE — everyone who plays, on any device, shows up here."; $("#note").classList.add("live"); }

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function photo(src, cls, alt = "") {
  if (src) { const i = new Image(); i.src = src; i.alt = alt; i.className = cls; i.loading = "lazy"; return i; }
  const d = el("div", cls + " noimg", "67"); return d;
}
// a player's picture: their GIF if they have one, otherwise their initials on a colour from their name
const PALETTE = ["#ff2bd6", "#00b8cc", "#7a3cff", "#ff7a00", "#1fae5b", "#e8364f", "#3d7bff", "#c28a00"];
function face(name, src, cls) {
  if (src) { const i = new Image(); i.src = src; i.alt = `${name} mid-67`; i.className = cls; i.loading = "lazy"; return i; }
  const words = name.trim().split(/\s+/);
  const ini = (words.length > 1 ? words[0][0] + words[1][0] : name.replace(/[^\p{L}\p{N}]/gu, "").slice(0, 1)).toUpperCase() || "67";
  let h = 0; for (const ch of name.toLowerCase()) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const d = el("div", `${cls} initials`, ini);
  d.style.background = PALETTE[h % PALETTE.length];
  return d;
}
const when = (iso) => {
  const d = new Date(iso); if (isNaN(d)) return "";
  const s = (Date.now() - d) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
};
const key = (name) => name.toLowerCase();

// group runs into players
function players() {
  const map = new Map();
  for (const r of runs) {
    const k = key(r.name);
    if (!map.has(k)) map.set(k, { name: r.name, runs: [] });
    map.get(k).runs.push(r);
  }
  for (const p of map.values()) {
    p.runs.sort((a, b) => String(b.at).localeCompare(String(a.at)));
    p.name = p.runs[0].name; // latest spelling
    p.bestScore = Math.max(0, ...p.runs.map((r) => r.score));
    const top = [...p.runs].sort((a, b) => (b.rate || 0) - (a.rate || 0))[0];
    p.title = top && top.rank;
    p.total = p.runs.reduce((n, r) => n + r.score, 0);
    p.peak = Math.max(...p.runs.map((r) => r.peak || 0));
    // profile picture: photo from their highest-scoring run that has one
    const withPhoto = p.runs.filter((r) => r.photo).sort((a, b) => b.score - a.score);
    p.avatar = withPhoto[0] && withPhoto[0].photo;
  }
  return [...map.values()];
}

function render() {
  // best run per player
  const best = new Map();
  for (const r of runs) {
    const b = best.get(key(r.name));
    if (!b || r.score > b.score) best.set(key(r.name), r);
  }
  const ranked = [...best.values()].sort((a, b) => b.score - a.score || String(a.at).localeCompare(String(b.at)));

  const podium = $("#podium"), list = $("#rankings");
  podium.replaceChildren(); list.replaceChildren();
  podium.className = "";
  $("#tapHint").hidden = !ranked.length;
  if (!ranked.length) {
    const e = el("div", "empty", "No 67s yet. Be the first legend.");
    const a = el("a", "btn", "▶ GO 67"); a.href = "./"; e.append(el("br"), a);
    podium.append(e);
    return;
  }
  // each player's picture: their best GIF, if they've posted any
  const avatars = new Map(players().map((p) => [key(p.name), p.avatar]));
  podium.className = "podium";
  // visual order: 2nd, 1st, 3rd
  const slots = [ranked[1], ranked[0], ranked[2]];
  const medals = ["🥈", "👑", "🥉"];
  slots.forEach((r, i) => {
    const spot = el("button", "spot");
    if (!r) { spot.style.visibility = "hidden"; podium.append(spot); return; }
    spot.addEventListener("click", () => openProfile(key(r.name)));
    const fr = el("div", "face");
    fr.append(face(r.name, avatars.get(key(r.name)), ""));
    spot.append(el("span", "medal", medals[i]), fr, el("div", "nm", r.name), el("div", "sc", r.score), el("div", "block", ["2", "1", "3"][i]));
    podium.append(spot);
  });
  ranked.slice(3, 50).forEach((r, i) => {
    const li = el("li");
    const row = el("button", "row");
    row.addEventListener("click", () => openProfile(key(r.name)));
    const av = avatars.get(key(r.name));
    const nm = el("div", "nm", r.name);
    if (av) nm.append(el("span", "gif", "🎞️"));
    row.append(el("span", "pos", `${i + 4}`), face(r.name, av, "ava"), nm, el("span", "sc", r.score));
    li.append(row); list.append(li);
  });
}

function openProfile(k) {
  const p = players().find((x) => key(x.name) === k);
  if (!p) return;
  const dlg = $("#profile");
  dlg.replaceChildren();
  const close = el("button", "btn close", "✕");
  close.setAttribute("aria-label", "Close profile");
  close.addEventListener("click", () => dlg.close());

  const head = el("div", "prof-head");
  const info = el("div");
  info.append(el("h3", null, p.name));
  if (p.title) { const b = el("span", "badge", p.title); b.style.marginTop = "10px"; info.append(b); }
  const stats = el("div", "prof-stats");
  const best = Math.max(0, ...p.runs.map((r) => r.score));
  for (const [v, l] of [[p.runs.length, "ROUNDS"], [best, "BEST SCORE"], [p.total, "TOTAL 67s"], [`${p.peak.toFixed(1)}/s`, "PEAK SPEED"]]) {
    const d = el("div"); d.append(el("b", null, v), el("small", null, l)); stats.append(d);
  }
  info.append(stats);
  head.append(face(p.name, p.avatar, "big"), info);

  const wallSec = el("div", "prof-sec");
  wallSec.append(el("h4", null, "🎞️ GIF WALL"));
  const wall = el("div", "wall");
  const shots = p.runs.filter((r) => r.photo).sort((a, b) => b.score - a.score);
  if (!shots.length) wall.append(el("p", "meta", "No GIFs yet."));
  for (const r of shots) {
    const s = el("div", "shot");
    const cap = el("div", "cap");
    cap.append(el("span", null, when(r.at)), el("b", null, r.score));
    const dl = el("button", "btn dl", "⬇ GIF");
    dl.title = `Download ${p.name}'s ${r.score} GIF`;
    dl.addEventListener("click", () => downloadGif(r.photo, `${p.name}-${r.score}-67s`, dl));
    const sh = el("button", "btn sh", "📤 SHARE");
    sh.title = `Share ${p.name}'s ${r.score} GIF`;
    sh.addEventListener("click", async () => { sh.disabled = true; const msg = await shareGif(r); sh.disabled = false; if (msg) toast(msg); });
    s.append(photo(r.photo, "", `${p.name} scoring ${r.score}`), cap, dl, sh);
    wall.append(s);
  }
  wallSec.append(wall);

  const histSec = el("div", "prof-sec");
  histSec.append(el("h4", null, "📜 EVERY ROUND"));
  const table = el("table", "history");
  const thead = el("tr");
  for (const h of ["WHEN", "SCORE", "SPEED", "RANK"]) thead.append(el("th", null, h));
  table.append(thead);
  for (const r of p.runs) {
    const tr = el("tr");
    tr.append(el("td", null, when(r.at)), el("td", "n", r.score),
      el("td", null, `${(r.rate || 0).toFixed(1)}/s`), el("td", null, r.rank || ""));
    table.append(tr);
  }
  histSec.append(table);

  dlg.append(close, head, wallSec, histSec);
  dlg.showModal();
}
$("#profile").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

render();

// keep it fresh: live every 10s on the shared board, or when you come back to this tab
const signature = (list) => list.map((r) => r.id + (r.photo ? "+" : "")).join();
async function refresh() {
  if (document.hidden || document.querySelector("dialog[open]")) return;
  const next = eventRounds(await allRuns());
  if (signature(next) !== signature(runs)) { runs = next; render(); }
}
document.addEventListener("visibilitychange", refresh);
if (sharedMode) setInterval(refresh, 10000);


// Save any player's clip to the device (works for shared-board URLs and on-device data URLs)
async function downloadGif(src, baseName, btn) {
  btn.disabled = true;
  try {
    const blob = await (await fetch(src)).blob();
    const ext = blob.type === "image/jpeg" ? "jpg" : "gif";
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), { href: url, download: `${baseName.replace(/[^\w-]+/g, "_")}.${ext}` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("GIF saved ⬇");
  } catch (err) {
    console.warn("GIF download failed:", err);
    toast("Couldn't download that GIF");
  } finally {
    btn.disabled = false;
  }
}

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}
</script>
